; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino

; Configuracion micro
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Monitor Serial
; upload_port = COMx            ; Puerto programacion
; monitor_port = COMx           ; Puerto monitor
monitor_speed = 115200        ; Velocidad monitor
upload_speed = 921600         ; Velocidad subida firmware
; monitor_raw = true            ; Mostrar logs de colores
; monitor_echo = true           ; Ver que se escribe
; monitor_eol = CR              ; Comportamiento tecla Enter
monitor_filters =
  esp32_exception_decoder     ; ESP32 Exception Decoder
  ; default
  ; send_on_enter               ; Enviar string al presionar enter (para CLI)

; Flags
build_flags =
  ; Activar Debug
  -DCORE_DEBUG_LEVEL=5        ; Activar nivel 5 de debug por terminal (verbose)
  -DCONFIG_ARDUHAL_LOG_COLORS ; Usar colores ARDUHAL para los tipos de logs

  ; Habilitar PSRAM externa de 4MB
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

; Adjuntar archivos binarios en ROM
; board_build.embed_files = data/crt/x509_crt_bundle.bin

; Librerias externas
; lib_deps =
