; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32@6.3.2
board = esp32-c3-devkitm-1    ; ESP32-C3 Super Mini (ESP32-C3FH4)
framework = arduino

; Configuracion micro
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

; Monitor Serial
; upload_port = COMx            ; Puerto programacion
; monitor_port = COMx           ; Puerto monitor
monitor_speed = 115200        ; Velocidad monitor
upload_speed = 921600         ; Velocidad subida firmware
; monitor_raw = true            ; Mostrar logs de colores
; monitor_echo = true           ; Ver que se escribe
; monitor_eol = CR              ; Comportamiento tecla Enter
monitor_filters =
  esp32_exception_decoder     ; ESP32 Exception Decoder
  ; default
  ; send_on_enter               ; Enviar string al presionar enter (para CLI)

; Flags
build_flags =
  ; Activar Debug
  -DCORE_DEBUG_LEVEL=5        ; Activar nivel 5 de debug por terminal (verbose)
  -DCONFIG_ARDUHAL_LOG_COLORS ; Usar colores ARDUHAL para los tipos de logs

  ; USB nativo (USB-Serial/JTAG): Serial sale por el USB-C
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Adjuntar archivos binarios en ROM
; board_build.embed_files = data/crt/x509_crt_bundle.bin

; Librerias externas
lib_deps =
  ; Bluetooth
  https://github.com/h2zero/NimBLE-Arduino.git#2.1.3